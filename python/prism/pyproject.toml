[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-multi-llm"
version = "1.0.0"
description = "Prism: Cost-Efficient Multi-LLM Inference with Flexible GPU Sharing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Prism Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "redis>=4.0.0",
]

# Note: sglang is NOT listed as a dependency because:
# 1. Prism is designed to work with existing sglang installations
# 2. sglang has complex CUDA dependencies that should be managed separately
# 3. Users should install sglang first, then install prism as a plugin
# If sglang is not installed, prism will fail at import time with a clear error

[project.optional-dependencies]
elastic = [
    "kvcached>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
prism-server = "prism.launch:main"

[project.urls]
"Homepage" = "https://github.com/sgl-project/prism"
"Bug Tracker" = "https://github.com/sgl-project/prism/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["prism*"]
